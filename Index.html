<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CG NEWS OFICIAL - Painel Administrativo Profissional</title>
    <!-- FONT AWESOME PARA ÍCONES DAS REDES SOCIAIS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding-bottom: 50px; }
        header { background: #11136c; color: white; padding: 20px; text-align: center; border-bottom: 4px solid #1a23a0; }
        .container { max-width: 750px; margin: 30px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #11136c; font-size: 0.95rem; }
        input[type="text"], input[type="password"], textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; background-color: #fff; }
        textarea { height: 150px; resize: vertical; }
        
        .file-upload-box { border: 2px dashed #cbd5e1; padding: 20px; text-align: center; border-radius: 8px; background: #f8fafc; cursor: pointer; }
        .file-upload-box input { display: none; }
        .file-upload-btn { background: #11136c; color: white; padding: 10px 20px; border-radius: 6px; display: inline-block; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .file-upload-btn:hover { background: #1a23a0; }
        
        .checkbox-group { display: flex; gap: 20px; margin-top: 5px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }

        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media(max-width: 600px) { .social-grid { grid-template-columns: 1fr; } }
        .social-input-wrapper { position: relative; }
        .social-input-wrapper i { position: absolute; left: 12px; top: 42px; font-size: 1.1rem; color: #64748b; }
        .social-input-wrapper input { padding-left: 40px; }

        button.btn-action { background: #11136c; color: white; border: none; padding: 14px 20px; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; font-size: 1.05rem; transition: background 0.2s; }
        button.btn-action:hover { background: #1a23a0; }
        
        .error-msg { color: #dc2626; margin-bottom: 15px; font-size: 0.9rem; text-align: center; font-weight: bold; }
        .hidden { display: none !important; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .logout-btn { background: #dc2626; width: auto; padding: 8px 16px; font-size: 0.85rem; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .logout-btn:hover { background: #b91c1c; }
        
        .preview-container { margin-top: 15px; text-align: center; }
        .preview-container img, .preview-container video { max-width: 100%; max-height: 220px; border-radius: 6px; display: none; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        footer { text-align: center; padding: 20px; color: #64748b; font-size: 0.85rem; margin-top: 30px; }
    </style>
</head>
<body>

    <header>
        <h2>CG NEWS OFICIAL — Painel Administrativo</h2>
    </header>

    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="tela-login">
            <h3 style="margin-bottom: 20px; color: #11136c; text-align: center;">Área Restrita do Jornalista</h3>
            <div id="erro-login" class="error-msg"></div>
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha">
            </div>
            <button class="btn-action" onclick="fazerLogin()">Entrar no Painel</button>
            <p style="text-align: center; margin-top: 20px;"><a href="../index.html" style="color: #11136c; text-decoration: none; font-weight: bold;">← Voltar para o Portal de Notícias</a></p>
        </div>

        <!-- TELA DE CADASTRO DE NOTÍCIAS -->
        <div id="tela-painel" class="hidden">
            <div class="top-bar">
                <h3 style="color: #11136c;">Cadastro de: Notícias</h3>
                <button class="logout-btn" onclick="fazerLogout()">Sair</button>
            </div>
            <div id="mensagem-sucesso" style="color: #16a34a; margin-bottom: 15px; font-weight: bold; text-align: center;"></div>
            
            <div class="form-group">
                <label>Categoria / Editoria</label>
                <select id="categoria">
                    <option value="">- Selecione -</option>
                    <option value="Últimas Notícias">Últimas Notícias</option>
                    <option value="Polícia">Polícia</option>
                    <option value="Trânsito">Trânsito</option>
                    <option value="Campo Grande">Campo Grande</option>
                    <option value="Mato Grosso do Sul">Mato Grosso do Sul</option>
                    <option value="Brasil">Brasil</option>
                    <option value="Mundo">Mundo</option>
                </select>
            </div>

            <div class="form-group">
                <label>Destaque na Página Principal</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" id="superDestaque"> Super Destaque (Topo)</label>
                    <label class="checkbox-label"><input type="checkbox" id="destaqueComum"> Destaque Comum</label>
                </div>
            </div>

            <div class="form-group">
                <label>Mídia (Foto ou Vídeo do Celular)</label>
                <div class="file-upload-box" onclick="document.getElementById('arquivoMidia').click()">
                    <span class="file-upload-btn"><i class="fa-solid fa-cloud-arrow-up"></i> Escolha a Imagem ou Vídeo</span>
                    <p style="font-size: 0.8rem; color: #64748b; margin-top: 8px;" id="fileNameDisplay">Toque para acessar os arquivos do seu celular</p>
                    <input type="file" id="arquivoMidia" accept="image/*,video/*" onchange="converterMidia(event)">
                </div>
                <div class="preview-container">
                    <img id="imgPreview" alt="Pré-visualização">
                    <video id="vidPreview" controls></video>
                </div>
            </div>

            <div class="form-group">
                <label>Fonte / Crédito da Imagem</label>
                <input type="text" id="fonteImagem" placeholder="Ex: Divulgação / PM-MS">
            </div>

            <div class="form-group">
                <label>Autor / Jornalista</label>
                <input type="text" id="autor" value="Max Gabriel" placeholder="Nome do autor">
            </div>

            <div class="form-group">
                <label>Data da Publicação</label>
                <input type="text" id="data" value="02/08/2026">
            </div>

            <div class="form-group">
                <label>Título da Notícia</label>
                <input type="text" id="titulo" placeholder="Digite o título principal">
            </div>

            <div class="form-group">
                <label>Subtítulo / Resumo</label>
                <input type="text" id="subtitulo" placeholder="Digite uma breve descrição">
            </div>

            <div class="form-group">
                <label>Texto Completo da Notícia</label>
                <textarea id="corpoNoticia" placeholder="Escreva todos os detalhes da notícia aqui..."></textarea>
            </div>

            <!-- SEÇÃO DE REDES SOCIAIS -->
            <div style="border-top: 2px solid #f1f5f9; padding-top: 20px; margin-top: 20px;">
                <label style="font-size: 1.1rem; margin-bottom: 15px; color: #11136c;"><i class="fa-solid fa-share-nodes"></i> Vincular Redes Sociais na Notícia</label>
                
                <div class="social-grid">
                    <div class="form-group social-input-wrapper">
                        <label>Instagram</label>
                        <i class="fa-brands fa-instagram"></i>
                        <input type="text" id="linkInsta" placeholder="Link do post ou perfil">
                    </div>
                    <div class="form-group social-input-wrapper">
                        <label>Facebook</label>
                        <i class="fa-brands fa-facebook-f"></i>
                        <input type="text" id="linkFace" placeholder="Link da postagem">
                    </div>
                    <div class="form-group social-input-wrapper">
                        <label>X (Twitter)</label>
                        <i class="fa-brands fa-x-twitter"></i>
                        <input type="text" id="linkX" placeholder="Link do tweet">
                    </div>
                    <div class="form-group social-input-wrapper">
                        <label>Threads</label>
                        <i class="fa-brands fa-threads"></i>
                        <input type="text" id="linkThreads" placeholder="Link do Threads">
                    </div>
                    <div class="form-group social-input-wrapper">
                        <label>TikTok</label>
                        <i class="fa-brands fa-tiktok"></i>
                        <input type="text" id="linkTiktok" placeholder="Link do vídeo">
                    </div>
                    <div class="form-group social-input-wrapper">
                        <label>Kwai</label>
                        <i class="fa-solid fa-video"></i>
                        <input type="text" id="linkKwai" placeholder="Link do vídeo do Kwai">
                    </div>
                    <div class="form-group social-input-wrapper" style="grid-column: span 2;">
                        <label>LinkedIn</label>
                        <i class="fa-brands fa-linkedin-in"></i>
                        <input type="text" id="linkLinkedin" placeholder="Link profissional">
                    </div>
                </div>
            </div>

            <button class="btn-action" onclick="salvarNoticia()">Publicar Notícia no Portal</button>
            <p style="text-align: center; margin-top: 20px;"><a href="../index.html" style="color: #11136c; text-decoration: none; font-weight: bold;" target="_blank">Ver o Portal Publicado →</a></p>
        </div>
    </div>

    <footer>
        © 2026 CG NEWS OFICIAL — Todos os direitos reservados.
    </footer>

    <script>
        const USER_CORRETO = "maxgabriel";
        const SENHA_CORRETA = "@M4x98209980";
        let midiaBase64 = "";

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('logado') === 'true') {
                mostrarPainel();
            }
        });

        function fazerLogin() {
            const uInput = document.getElementById('usuario').value.trim();
            const sInput = document.getElementById('senha').value.trim();
            const erroDiv = document.getElementById('erro-login');

            if (uInput === USER_CORRETO && sInput === SENHA_CORRETA) {
                sessionStorage.setItem('logado', 'true');
                erroDiv.innerText = '';
                mostrarPainel();
            } else {
                erroDiv.innerText = 'Usuário ou senha incorretos!';
            }
        }

        function mostrarPainel() {
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('tela-painel').classList.remove('hidden');
        }

        function fazerLogout() {
            sessionStorage.removeItem('logado');
            document.getElementById('tela-painel').classList.add('hidden');
            document.getElementById('tela-login').classList.remove('hidden');
            document.getElementById('usuario').value = '';
            document.getElementById('senha').value = '';
        }

        function converterMidia(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('fileNameDisplay').innerText = "Arquivo selecionado: " + file.name;

            const reader = new FileReader();
            reader.onload = function(uploadevento) {
                midiaBase64 = uploadevento.target.result;
                
                const imgPrev = document.getElementById('imgPreview');
                const vidPrev = document.getElementById('vidPreview');

                if (file.type.startsWith('image/')) {
                    imgPrev.src = midiaBase64;
                    imgPrev.style.display = 'block';
                    vidPrev.style.display = 'none';
                } else if (file.type.startsWith('video/')) {
                    vidPrev.src = midiaBase64;
                    vidPrev.style.display = 'block';
                    imgPrev.style.display = 'none';
                }
            };
            reader.readAsDataURL(file);
        }

        function salvarNoticia() {
            const novaNoticia = {
                categoria: document.getElementById('categoria').value,
                superDestaque: document.getElementById('superDestaque').checked,
                destaqueComum: document.getElementById('destaqueComum').checked,
                data: document.getElementById('data').value,
                autor: document.getElementById('autor').value,
                titulo: document.getElementById('titulo').value,
                subtitulo: document.getElementById('subtitulo').value,
                corpo: document.getElementById('corpoNoticia').value,
                fonteImagem: document.getElementById('fonteImagem').value,
                imagem: midiaBase64,
                redesSociais: {
                    instagram: document.getElementById('linkInsta').value,
                    facebook: document.getElementById('linkFace').value,
                    x: document.getElementById('linkX').value,
                    threads: document.getElementById('linkThreads').value,
                    tiktok: document.getElementById('linkTiktok').value,
                    kwai: document.getElementById('linkKwai').value,
                    linkedin: document.getElementById('linkLinkedin').value
                }
            };

            if (!novaNoticia.titulo) {
                alert('Por favor, preencha pelo menos o Título da notícia.');
                return;
            }

            let noticias = JSON.parse(localStorage.getItem('portal_noticias')) || [];
            noticias.unshift(novaNoticia);
            localStorage.setItem('portal_noticias', JSON.stringify(noticias));

            document.getElementById('mensagem-sucesso').innerText = 'Notícia publicada com sucesso no portal com todas as redes sociais!';
            
            // Limpa o formulário
            document.getElementById('titulo').value = '';
            document.getElementById('subtitulo').value = '';
            document.getElementById('corpoNoticia').value = '';
            document.getElementById('fonteImagem').value = '';
            document.getElementById('linkInsta').value = '';
            document.getElementById('linkFace').value = '';
            document.getElementById('linkX').value = '';
            document.getElementById('linkThreads').value = '';
            document.getElementById('linkTiktok').value = '';
            document.getElementById('linkKwai').value = '';
            document.getElementById('linkLinkedin').value = '';
            document.getElementById('arquivoMidia').value = '';
            document.getElementById('fileNameDisplay').innerText = "Toque para acessar os arquivos do seu celular";
            document.getElementById('imgPreview').style.display = 'none';
            document.getElementById('vidPreview').style.display = 'none';
            document.getElementById('superDestaque').checked = false;
            document.getElementById('destaqueComum').checked = false;
            midiaBase64 = "";

            setTimeout(() => {
                document.getElementById('mensagem-sucesso').innerText = '';
            }, 3500);
        }
    </script>
</body>
</html>

<header class="bg-blue-900 text-white p-4 shadow-md">
  <div class="container mx-auto flex items-center justify-between">
    
    <div class="flex items-center space-x-3">
      <button id="menu-btn" class="text-white focus:outline-none" aria-label="Abrir Menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      
      <a href="/" class="text-lg font-bold uppercase tracking-wider">CG News Oficial</a>
    </div>

    <div class="flex items-center">
      <button id="search-btn" class="text-white focus:outline-none p-1 hover:text-gray-200" aria-label="Pesquisar Notícia" onclick="toggleSearchModal()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </button>
    </div>

  </div>
</header>

<div id="search-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-start justify-center pt-20 px-4">
  <div class="bg-white w-full max-w-lg rounded-lg shadow-lg p-4 relative">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-gray-800 font-bold">Pesquisar Notícias</h3>
      <button onclick="toggleSearchModal()" class="text-gray-500 hover:text-gray-800 font-bold text-xl">&times;</button>
    </div>
    <input type="text" id="search-input" placeholder="Digite o que você procura..." class="w-full border border-gray-300 rounded p-2 text-gray-800 focus:outline-none focus:border-blue-900">
    <div id="search-results" class="mt-3 max-h-60 overflow-y-auto space-y-2"></div>
  </div>
</div>

<script>
  function toggleSearchModal() {
    const modal = document.getElementById('search-modal');
    modal.classList.toggle('hidden');
    if (!modal.classList.contains('hidden')) {
      document.getElementById('search-input').focus();
    }
  }
</script>

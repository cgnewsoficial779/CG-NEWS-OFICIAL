        .social-icons i { font-size: 18px; }

        .img-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; overflow: hidden; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

        <div style="font-size: 20px; cursor: pointer;" onclick="window.location.href='index.html'"><i class="fas fa-bars"></i></div>

        <div style="font-size: 20px; cursor: pointer;"><i class="fas fa-search"></i></div>
    </header>

    <div class="sub-header-bar">
        <span>Informação em Tempo Real</span>

    </div>

    <div class="materia-container-box">
        <div onclick="window.location.href='index.html'" style="color: #11136c; font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 25px; display: inline-flex; align-items: center; gap: 8px;">
            <i class="fas fa-arrow-left"></i> Voltar ao Início
        </div>
        
        <h1>${titulo}</h1>
        
        <div style="color: #4a5568; font-size: 12px; font-weight: 600; margin-bottom: 15px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px;">
            <div><i class="far fa-clock"></i> ${dataTexto}</div>
            <div><i class="fas fa-user"></i> Por ${autor}</div>
            <div><i class="far fa-folder"></i> ${categoria}</div>
        </div>

        <div style="margin-bottom: 20px;">
            <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(titulo)}%20-%20${encodeURIComponent(urlPagina)}" target="_blank" style="background: #25d366; color: white; padding: 8px 14px; border-radius: 4px; text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; font-size: 13px;">
                <i class="fab fa-whatsapp"></i> Partilhar no WhatsApp
            </a>
        </div>

        <div class="img-container">
            <img src="${imagemUrl}" alt="Capa da Matéria">
        </div>
        
        <div class="texto-corpo">${corpoHtml}</div>

        ${blocoRedeSocial}
    </div>

    <footer>
        <div class="footer-social-title">Nossas Redes Sociais</div>
        <div class="social-icons">
            <a href="https://wa.me/556796619364" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.facebook.com/share/1Bv1aCaxte/" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="https://www.instagram.com/cgnews.oficial?igsh=MTU4YmZ5eHhpaXpveQ==" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://x.com/CGNEWS0FICIAL" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://youtube.com/@cgnewsoficial1?si=nrVlHWPdjh5KpcuV" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>
        <div class="footer-copy">

    </footer>

            const blob = new Blob([codigoHtml], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = nomeArquivo;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ==========================================
        // FUNÇÕES DO MENU
        // ==========================================
        window.alternarSidebar = function(forceClose = false) {
            const panel = document.getElementById('sidebarPanel');
            const overlay = document.getElementById('sidebarOverlay');
            if (panel.classList.contains('ativo') || forceClose) {
                panel.classList.remove('ativo'); overlay.style.display = 'none';
            } else {
                panel.classList.add('ativo'); overlay.style.display = 'block';
            }
        };

        window.abrirModalGerenciamento = function() {
            window.alternarSidebar(true);
            document.getElementById('modalFullscreenGerenciar').style.display = 'block';
            window.renderizarListasDeNoticias();
        };

        window.fecharModalGerenciamento = function() {
            document.getElementById('modalFullscreenGerenciar').style.display = 'none';
        };

        window.novaMateriaPainel = function() {
            window.cancelarEdicao();
            window.alternarSidebar(true);
            window.fecharModalGerenciamento();
        };

        // ==========================================
        // UPLOAD DE IMAGEM PARA O STORAGE (ADEUS LIMITE 1MB)
        // ==========================================
        document.getElementById('imagemInput1').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            imagemFilePrincipal = file; // Guarda o ficheiro para o Firebase Storage
            
            // Apenas para mostrar a prévia na tela rapidamente:
            const reader = new FileReader();
            reader.onload = (evt) => {
                document.getElementById('imagemBase64_1').value = evt.target.result;
                document.getElementById('previewContainerImagens').innerHTML = `<img src="${evt.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
            };
            reader.readAsDataURL(file);
        });

        window.removerImagem = function(num) {
            document.getElementById(`imagemInput${num}`).value = "";
            document.getElementById(`imagemBase64_${num}`).value = "";
            imagemFilePrincipal = null;
            document.getElementById('previewContainerImagens').innerHTML = '<div class="preview-placeholder"><i class="fas fa-camera"></i> Nenhuma imagem</div>';
        };

        window.cancelarEdicao = function() {
            idEditando = null;
            document.getElementById('formNoticia').reset();
            quill.root.innerHTML = '';
            window.removerImagem(1);
            document.getElementById('btnSalvar').innerHTML = `<i class="fas fa-paper-plane"></i> PUBLICAR MATÉRIA`;
            document.getElementById('btnCancelar').style.display = 'none';
        };

        // ==========================================
        // GERENCIAR E SALVAR MATÉRIAS NO FIREBASE
        // ==========================================
        window.carregarListaNoticias = async function() {
            try {
                const q = query(collection(db, "noticias"), orderBy("dataCriacao", "desc"));
                const querySnapshot = await getDocs(q);
                window.listaCompletaNoticias = [];
                window.noticiasAdmin = {};
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    data.id = docSnap.id;
                    window.listaCompletaNoticias.push(data);
                    window.noticiasAdmin[data.id] = data;
                });
            } catch(e) { console.log(e); }
        };

        window.renderizarListasDeNoticias = async function() {
            const container = document.getElementById('lista-noticias-fullscreen');
            container.innerHTML = 'Carregando...';
            await window.carregarListaNoticias();
            container.innerHTML = '';
            if (window.listaCompletaNoticias.length === 0) {
                container.innerHTML = '<p>Nenhuma matéria cadastrada.</p>';
                return;
            }
            window.listaCompletaNoticias.forEach((item) => {
                const id = item.id;
                const img1 = item.imagem1 || item.imagemBase64_1 || '';
                const div = document.createElement('div');
                div.className = 'noticia-item';
                div.innerHTML = `
                    <div class="noticia-miniatura">${img1 ? `<img src="${img1}">` : '<i class="fas fa-image"></i>'}</div>
                    <div class="noticia-conteudo-info">
                        <strong>${item.titulo || 'Sem Título'}</strong>
                        <div class="acoes-btn">
                            <button type="button" class="btn-editar" onclick="window.gerarHtmlExistente('${id}')" style="background:#28a745; color:white; border:none;"><i class="fas fa-file-code"></i> Baixar Página (Redes Sociais)</button>
                            <button type="button" class="btn-apagar" onclick="window.apagarNoticia('${id}')"><i class="fas fa-trash-alt"></i> Excluir</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        };

        window.apagarNoticia = async function(id) {
            if(confirm("Tem a certeza que deseja excluir esta matéria?")) {
                await deleteDoc(doc(db, "noticias", id));
                alert("Excluído!");
                window.renderizarListasDeNoticias();
            }
        };

        window.gerarHtmlExistente = function(id) {
            const item = window.noticiasAdmin[id];
            if (!item) return;
            const imgCapa = item.imagem1 || item.imagemBase64_1 || "https://www.cgnewsoficial.com.br/logo.jpg";
            const dataFmt = new Date(item.dataCriacao || Date.now()).toLocaleDateString('pt-BR');
            let resumoText = item.textoRico ? item.textoRico.replace(/<[^>]*>?/gm, '').substring(0, 140) + "..." : "Leia a matéria completa no CG News.";
            
            gerarEDescargarHtmlMateria(id, item.titulo, resumoText, imgCapa, item.autor || "Redação", dataFmt, item.categoria || "Geral", item.textoRico || "", item.linkRedeSocial || "");
            alert("📥 Ficheiro HTML do G1 gerado! Agora envia para o teu GitHub.");
        };

        document.getElementById('formNoticia').addEventListener('submit', async function(e) {
            e.preventDefault();
            const categorias = Array.from(document.querySelectorAll('input[name="categoria"]:checked')).map(cb => cb.value);
            if (categorias.length === 0) { alert("Selecione uma categoria."); return; }

            const btnSubmit = document.getElementById('btnSalvar');
            btnSubmit.innerHTML = "<i class='fas fa-spinner fa-spin'></i> A processar (Nuvem)...";
            btnSubmit.disabled = true;

            try {
                let img1Url = document.getElementById('imagemBase64_1').value; // Mantém fallback base64
                
                // MAGIA: Upload da imagem real para o Storage (Evita o erro de 1MB)
                if (imagemFilePrincipal) {
                    btnSubmit.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Enviando Imagem...";
                    const storageRef = ref(storage, 'capas/' + Date.now() + '_' + imagemFilePrincipal.name);
                    await uploadBytes(storageRef, imagemFilePrincipal);
                    img1Url = await getDownloadURL(storageRef); // Pega o link curto e perfeito
                }

                const noticiaObj = {
                    titulo: document.getElementById('titulo').value,
                    autor: document.getElementById('autor').value,
                    linkRedeSocial: document.getElementById('linkRedeSocial').value,
                    textoRico: quill.root.innerHTML,
                    categorias: categorias,
                    categoria: categorias[0],
                    imagem1: img1Url, // Guarda o link do Storage
                    dataCriacao: Date.now(),
                    dataAtualizacao: Date.now()
                };

                let idSalvar = idEditando;
                if (idEditando) {
                    await updateDoc(doc(db, "noticias", idEditando), noticiaObj);
                } else {
                    const docRef = await addDoc(collection(db, "noticias"), noticiaObj);
                    idSalvar = docRef.id;
                }

                // Geração do Cartão Open Graph (Estilo G1)
                const dataFmt = new Date(noticiaObj.dataCriacao).toLocaleDateString('pt-BR');
                let resumoText = noticiaObj.textoRico.replace(/<[^>]*>?/gm, '').substring(0, 140) + "...";
                
                gerarEDescargarHtmlMateria(idSalvar, noticiaObj.titulo, resumoText, img1Url || "https://www.cgnewsoficial.com.br/logo.jpg", noticiaObj.autor || "Redação", dataFmt, noticiaObj.categoria, noticiaObj.textoRico, noticiaObj.linkRedeSocial);

                alert("✅ Sucesso! Matéria guardada na nuvem sem limites.\n\nO ficheiro HTML foi baixado. Joga no GitHub para as redes sociais ativarem o Cartão Perfeito!");
                window.location.reload();
            } catch (err) {
                console.error(err);
                alert("❌ Erro ao salvar. Verifica as permissões de Storage do Firebase.");
                btnSubmit.innerHTML = `<i class="fas fa-paper-plane"></i> PUBLICAR MATÉRIA`;
                btnSubmit.disabled = false;
            }
        });

        window.onload = async function() { await window.carregarListaNoticias(); };
    </script>
</body>
</html>

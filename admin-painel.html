<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Redação</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #f1f5f9; padding: 20px; }
        .header { background: #11136c; color: white; padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; font-weight: 800; text-transform: uppercase; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #1e293b; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; outline: none; }
        .form-group textarea { height: 180px; resize: vertical; }
        .btn-submit { width: 100%; background: #11136c; color: white; border: none; padding: 14px; font-size: 16px; font-weight: 800; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: #1a23a0; }
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 20px; font-weight: 600; display: none; }
        .alert-success { background: #dcfce7; color: #166534; }
        .alert-error { background: #fee2e2; color: #991b1b; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjl4R4h2An2POmuZgMhAFsLbdhuzauxyY",
            authDomain: "cgnewsoficial7799.firebaseapp.com",
            projectId: "cgnewsoficial7799",
            storageBucket: "cgnewsoficial7799.firebasestorage.app",
            messagingSenderId: "792965935073",
            appId: "1:792965935073:web:6a43726000feec3b356ca0",
            measurementId: "G-MCQJ63SYP1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Proteção da Página: Se não estiver logado, redireciona para a tela de login
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "admin-login.html";
            }
        });

        window.sair = function() {
            signOut(auth).then(() => {
                window.location.href = "admin-login.html";
            });
        };

        window.publicarNoticia = async function(event) {
            event.preventDefault();
            const alertBox = document.getElementById("alert-box");
            
            const titulo = document.getElementById("titulo").value.trim();
            const categoria = document.getElementById("categoria").value;
            const imagem = document.getElementById("imagem").value.trim();
            const conteudo = document.getElementById("conteudo").value.trim();

            try {
                await addDoc(collection(db, "noticias"), {
                    titulo: titulo,
                    categoria: categoria,
                    imagem: imagem,
                    conteudo: conteudo,
                    dataCriacao: serverTimestamp()
                });

                alertBox.className = "alert alert-success";
                alertBox.innerText = "Notícia publicada com sucesso!";
                alertBox.style.display = "block";
                document.getElementById("form-noticia").reset();
            } catch (e) {
                alertBox.className = "alert alert-error";
                alertBox.innerText = "Erro ao publicar matéria: " + e.message;
                alertBox.style.display = "block";
            }
        };
    </script>
</head>
<body>

    <div class="header">
        <h1>Painel de Redação</h1>
        <button onclick="sair()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    </div>

    <div class="container">
        <div id="alert-box" class="alert"></div>
        <form id="form-noticia" onsubmit="publicarNoticia(event)">
            <div class="form-group">
                <label>Título / Manchete</label>
                <input type="text" id="titulo" placeholder="Digite o título da matéria..." required>
            </div>
            <div class="form-group">
                <label>Categoria</label>
                <select id="categoria" required>
                    <option value="Cidades">Cidades</option>
                    <option value="Polícia">Polícia</option>
                    <option value="Trânsito">Trânsito</option>
                    <option value="Política">Política</option>
                    <option value="Geral">Geral</option>
                </select>
            </div>
            <div class="form-group">
                <label>URL da Imagem de Capa (Link da foto)</label>
                <input type="url" id="imagem" placeholder="https://exemplo.com/imagem.jpg" required>
            </div>
            <div class="form-group">
                <label>Conteúdo da Notícia</label>
                <textarea id="conteudo" placeholder="Escreva a matéria completa aqui..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">Publicar Notícia</button>
        </form>
    </div>

</body>
</html>

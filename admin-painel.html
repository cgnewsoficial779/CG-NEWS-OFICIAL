<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - CG NEWS OFICIAL</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f2f4f7; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #11136c; font-size: 22px; border-bottom: 2px solid #11136c; padding-bottom: 10px; margin-bottom: 25px; }
        h2 { color: #11136c; font-size: 18px; border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 15px; margin-top: 40px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        input[type="text"], textarea, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        textarea { height: 150px; resize: vertical; }
        
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 15px; border: 1px solid #ccc; padding: 10px; border-radius: 4px; }
        .checkbox-group label { font-weight: normal; margin-bottom: 0; display: flex; align-items: center; gap: 5px; }
        
        .btn-submit { background-color: #11136c; color: white; border: none; padding: 15px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #0a0b45; }
        .btn-cancelar { background-color: #888; color: white; border: none; padding: 10px; width: 100%; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; display: none; }
        
        /* Estilos da lista de notícias */
        .noticia-item { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
        .noticia-info strong { display: block; color: #11136c; font-size: 16px; }
        .noticia-info span { font-size: 12px; color: #666; }
        .acoes-btn { display: flex; gap: 10px; }
        .btn-editar { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-apagar { background: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cadastro de Notícias</h1>

        <form id="formNoticia">
            <div class="form-group">
                <label>Categorias (Selecione uma ou mais)</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="categoria" value="Polícia"> Polícia</label>
                    <label><input type="checkbox" name="categoria" value="Trânsito"> Trânsito</label>
                    <label><input type="checkbox" name="categoria" value="Campo Grande"> Campo Grande</label>
                    <label><input type="checkbox" name="categoria" value="Mato Grosso do Sul"> Mato Grosso do Sul</label>
                    <label><input type="checkbox" name="categoria" value="Brasil"> Brasil</label>
                    <label><input type="checkbox" name="categoria" value="Mundo"> Mundo</label>
                </div>
            </div>

            <div class="form-group">
                <label>Selecionar Imagem do Celular</label>
                <input type="file" id="imagemUpload" accept="image/*">
                <small style="color: #666; font-size: 11px;">A imagem será comprimida automaticamente.</small>
                <input type="hidden" id="imagemBase64">
            </div>

            <div class="form-group">
                <label>Fonte Imagem</label>
                <input type="text" id="fonteImagem" placeholder="Créditos da imagem">
            </div>

            <div class="form-group">
                <label>Link de Incorporação (Redes Sociais / Vídeo)</label>
                <input type="text" id="linkRedeSocial" placeholder="Cole o link do Instagram, TikTok, Facebook, YouTube, etc.">
            </div>

            <div class="form-group">
                <label>Autor</label>
                <input type="text" id="autor" placeholder="Nome do autor da matéria">
            </div>

            <div class="form-group">
                <label>Título</label>
                <input type="text" id="titulo" placeholder="Título da notícia" required>
            </div>

            <div class="form-group">
                <label>Texto</label>
                <textarea id="texto" placeholder="Escreva a matéria completa aqui..." required></textarea>
            </div>

            <div class="form-group">
                <label>Fonte</label>
                <input type="text" id="fonteNoticia" placeholder="Fonte da notícia">
            </div>

            <button type="submit" id="btnSalvar" class="btn-submit">Publicar Notícia</button>
            <button type="button" id="btnCancelar" class="btn-cancelar" onclick="cancelarEdicao()">Cancelar Edição</button>
        </form>

        <!-- SEÇÃO PARA GERENCIAR NOTÍCIAS -->
        <h2>Notícias Publicadas (Editar / Apagar)</h2>
        <div id="lista-noticias">
            <p style="color: #888; font-size: 14px;">Carregando matérias...</p>
        </div>

    </div>

    <!-- SCRIPT DO FIREBASE E FUNCIONAMENTO DO PAINEL -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjl4R4h2An2POmuZgMhAFsLbdhuzauxyY",
            authDomain: "cgnewsoficial7799.firebaseapp.com",
            projectId: "cgnewsoficial7799",
            storageBucket: "cgnewsoficial7799.firebasestorage.app",
            messagingSenderId: "792965935073",
            appId: "1:792965935073:web:6a43726000feec3b356ca0",
            measurementId: "G-MCQJ63SYP1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let idEditando = null;
        window.noticiasAdmin = {};

        // COMPRESSÃO DE IMAGEM
        document.getElementById("imagemUpload").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const base64 = canvas.toDataURL("image/jpeg", 0.7);
                    document.getElementById("imagemBase64").value = base64;
                    alert("Imagem carregada e comprimida com sucesso!");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        // SALVAR OU ATUALIZAR NOTÍCIA
        document.getElementById("formNoticia").addEventListener("submit", async function(e) {
            e.preventDefault();
            document.getElementById("btnSalvar").innerText = "Salvando...";

            const checkboxes = document.querySelectorAll('input[name="categoria"]:checked');
            const categoriasSelecionadas = Array.from(checkboxes).map(cb => cb.value);

            const noticiaDados = {
                categorias: categoriasSelecionadas,
                categoria: categoriasSelecionadas.length > 0 ? categoriasSelecionadas[0] : "", // fallback
                imagem: document.getElementById("imagemBase64").value,
                fonteImagem: document.getElementById("fonteImagem").value,
                linkRedeSocial: document.getElementById("linkRedeSocial").value,
                autor: document.getElementById("autor").value,
                titulo: document.getElementById("titulo").value,
                texto: document.getElementById("texto").value,
                fonteNoticia: document.getElementById("fonteNoticia").value,
                dataAtualizacao: Date.now()
            };

            try {
                if (idEditando) {
                    // Atualizar matéria existente
                    const docRef = doc(db, "noticias", idEditando);
                    await updateDoc(docRef, noticiaDados);
                    alert("Notícia ATUALIZADA com sucesso!");
                } else {
                    // Criar nova matéria
                    await addDoc(collection(db, "noticias"), noticiaDados);
                    alert("Notícia PUBLICADA com sucesso!");
                }
                
                document.getElementById("formNoticia").reset();
                document.getElementById("imagemBase64").value = "";
                cancelarEdicao();
                carregarListaNoticias();

            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("Erro ao salvar a notícia.");
                document.getElementById("btnSalvar").innerText = idEditando ? "Atualizar Notícia" : "Publicar Notícia";
            }
        });

        // CARREGAR LISTA PARA EDITAR/APAGAR
        async function carregarListaNoticias() {
            const listaDiv = document.getElementById("lista-noticias");
            listaDiv.innerHTML = "<p>Carregando...</p>";
            
            try {
                const q = query(collection(db, "noticias"), orderBy("dataAtualizacao", "desc"));
                const snapshot = await getDocs(q);
                listaDiv.innerHTML = "";
                
                if (snapshot.empty) {
                    listaDiv.innerHTML = "<p style='color: #888; font-size: 14px;'>Nenhuma notícia publicada ainda.</p>";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const id = docSnap.id;
                    window.noticiasAdmin[id] = item;
                    
                    const d = new Date(item.dataAtualizacao);
                    const dataFormatada = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + " às " + d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

                    listaDiv.innerHTML += `
                        <div class="noticia-item">
                            <div class="noticia-info">
                                <strong>${item.titulo}</strong>
                                <span>Publicado em: ${dataFormatada}</span>
                            </div>
                            <div class="acoes-btn">
                                <button class="btn-editar" onclick="prepararEdicao('${id}')">Editar</button>
                                <button class="btn-apagar" onclick="apagarNoticia('${id}')">Apagar</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Erro ao listar:", error);
                listaDiv.innerHTML = "<p>Erro ao carregar a lista de notícias.</p>";
            }
        }

        // PREPARAR FORMULÁRIO PARA EDIÇÃO
        window.prepararEdicao = function(id) {
            const item = window.noticiasAdmin[id];
            if (!item) return;

            idEditando = id;
            document.getElementById("btnSalvar").innerText = "Atualizar Notícia";
            document.getElementById("btnSalvar").style.backgroundColor = "#007bff";
            document.getElementById("btnCancelar").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' }); // Rola a tela para o topo

            // Preencher os campos textuais
            document.getElementById("titulo").value = item.titulo || "";
            document.getElementById("texto").value = item.texto || "";
            document.getElementById("autor").value = item.autor || "";
            document.getElementById("linkRedeSocial").value = item.linkRedeSocial || "";
            document.getElementById("fonteImagem").value = item.fonteImagem || "";
            document.getElementById("fonteNoticia").value = item.fonteNoticia || "";
            document.getElementById("imagemBase64").value = item.imagem || "";

            // Marcar checkboxes corretamente
            const checkboxes = document.querySelectorAll('input[name="categoria"]');
            checkboxes.forEach(cb => cb.checked = false); // limpa tudo
            
            if (item.categorias && item.categorias.length > 0) {
                item.categorias.forEach(cat => {
                    const check = document.querySelector(`input[name="categoria"][value="${cat}"]`);
                    if (check) check.checked = true;
                });
            } else if (item.categoria) {
                const check = document.querySelector(`input[name="categoria"][value="${item.categoria}"]`);
                if (check) check.checked = true;
            }
        };

        // CANCELAR EDIÇÃO E VOLTAR PARA MODO "PUBLICAR"
        window.cancelarEdicao = function() {
            idEditando = null;
            document.getElementById("formNoticia").reset();
            document.getElementById("imagemBase64").value = "";
            document.getElementById("btnSalvar").innerText = "Publicar Notícia";
            document.getElementById("btnSalvar").style.backgroundColor = "#11136c";
            document.getElementById("btnCancelar").style.display = "none";
        };

        // APAGAR NOTÍCIA
        window.apagarNoticia = async function(id) {
            const confirmacao = confirm("Tem certeza que deseja apagar esta matéria definitivamente?");
            if (confirmacao) {
                try {
                    await deleteDoc(doc(db, "noticias", id));
                    alert("Notícia apagada com sucesso!");
                    carregarListaNoticias(); // recarrega a lista
                } catch (error) {
                    console.error("Erro ao apagar:", error);
                    alert("Erro ao tentar apagar a notícia.");
                }
            }
        };

        // Inicia carregando a lista
        carregarListaNoticias();
    </script>
</body>
</html>

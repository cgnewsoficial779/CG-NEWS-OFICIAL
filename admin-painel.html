<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel 3.0 - CG NEWS OFICIAL</title>

    <!-- ÍCONES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- CROPPER.JS PARA EDIÇÃO DE IMAGEM -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <!-- QUILL.JS PARA O EDITOR DE TEXTO PROFISSIONAL -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f0f2f5; padding: 15px 10px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .header-admin { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #11136c; padding-bottom: 15px; margin-bottom: 25px; }
        .header-admin h1 { color: #11136c; font-size: 20px; font-weight: 900; text-transform: uppercase; }
        .header-admin span { background: #d92323; color: white; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; letter-spacing: 1px; }

        .section-box { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .section-title { font-size: 15px; font-weight: bold; color: #11136c; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #eee; padding-bottom: 8px; text-transform: uppercase; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 700; margin-bottom: 6px; color: #444; font-size: 12px; text-transform: uppercase; }
        input[type="text"], select, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; transition: 0.2s; background: #fff; }
        input[type="text"]:focus { border-color: #11136c; box-shadow: 0 0 5px rgba(17, 19, 108, 0.2); }

        /* EDITOR DE TEXTO (QUILL) */
        .ql-container { height: 300px; font-size: 16px; background: #fff; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; }
        .ql-toolbar { background: #f8f9fa; border-top-left-radius: 6px; border-top-right-radius: 6px; }

        /* CHECKBOXES DE CATEGORIA */
        .checkbox-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #ddd; padding: 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .checkbox-item:hover { background: #f1f1f1; }
        .checkbox-item input { width: 16px; height: 16px; cursor: pointer; }
        .checkbox-item span { font-size: 13px; font-weight: 600; color: #333; }

        /* ESTÚDIO DE IMAGEM CROPPER */
        .cropper-wrapper { background: #222; max-height: 400px; width: 100%; display: none; overflow: hidden; border-radius: 6px; text-align: center; margin-top: 10px; }
        #imageToCrop { display: block; max-width: 100%; max-height: 400px; margin: 0 auto; }
        
        .aspect-ratios { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #ddd; justify-content: center;}
        .btn-ratio { background: #e0e0e0; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; color: #333; flex: 1; min-width: 80px; }
        .btn-ratio:hover { background: #ccc; }
        .btn-ratio.active { background: #11136c; color: white; }
        .btn-confirm-crop { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }

        .preview-box { width: 100%; border: 2px dashed #bbb; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fff; margin-top: 10px; padding: 10px; min-height: 100px; }
        .preview-box img { max-width: 100%; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        /* BOTÕES DE AÇÃO */
        .btn-submit { background-color: #11136c; color: white; border: none; padding: 16px; width: 100%; font-size: 16px; font-weight: 900; border-radius: 6px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; text-transform: uppercase; }
        .btn-submit:hover { background-color: #0a0b45; transform: scale(0.99); }
        .btn-cancelar { background-color: #dc3545; color: white; border: none; padding: 12px; width: 100%; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; display: none; }

        /* LISTA DE MATÉRIAS */
        .noticia-item { border: 1px solid #ddd; padding: 15px; margin-bottom: 12px; border-radius: 8px; background: #fff; display: flex; flex-direction: column; gap: 10px; }
        .noticia-info strong { display: block; color: #11136c; font-size: 16px; margin-bottom: 5px; line-height: 1.3; }
        .noticia-info span { font-size: 12px; color: #666; background: #f0f0f0; padding: 3px 6px; border-radius: 4px; }
        .acoes-btn { display: flex; gap: 10px; }
        .btn-editar { background: #007bff; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; flex: 1; }
        .btn-apagar { background: #dc3545; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; flex: 1; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-admin">
            <h1><i class="fas fa-satellite-dish"></i> CG NEWS ADMIN</h1>
            <span>VERSÃO 3.0</span>
        </div>

        <form id="formNoticia">
            
            <!-- CATEGORIAS -->
            <div class="section-box">
                <div class="section-title"><i class="fas fa-tags"></i> Nicho / Categoria</div>
                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" name="categoria" value="Polícia"><span>Polícia</span></label>
                    <label class="checkbox-item"><input type="checkbox" name="categoria" value="Trânsito"><span>Trânsito</span></label>
                    <label class="checkbox-item"><input type="checkbox" name="categoria" value="Política"><span>Política</span></label>
                    <label class="checkbox-item"><input type="checkbox" name="categoria" value="Esporte"><span>Esporte</span></label>
                    <label class="checkbox-item"><input type="checkbox" name="categoria" value="In Memoriam"><span>In Memoriam</span></label>
                    <label class="checkbox-item"><input type="checkbox" name="categoria" value="Campo Grande"><span>Campo Grande</span></label>
                    <label class="checkbox-item"><input type="checkbox" name="categoria" value="Mato Grosso do Sul"><span>Mato Grosso do Sul</span></label>
                    <label class="checkbox-item"><input type="checkbox" name="categoria" value="Brasil"><span>Brasil</span></label>
                    <label class="checkbox-item"><input type="checkbox" name="categoria" value="Mundo"><span>Mundo</span></label>
                </div>
            </div>

            <!-- ESTÚDIO DE FOTOS PRO -->
            <div class="section-box">
                <div class="section-title"><i class="fas fa-crop-alt"></i> Estúdio de Capa 3.0 (Corte Inteligente)</div>
                
                <div class="form-group">
                    <label>Selecione a Foto da Galeria</label>
                    <input type="file" id="imagemInput" accept="image/*">
                </div>

                <!-- AQUI FOI CORRIGIDO O PROBLEMA DA TELA PRETA -->
                <div class="cropper-wrapper" id="cropperWrapper">
                    <img id="imageToCrop" src="">
                </div>

                <div class="aspect-ratios" id="ratioControls" style="display: none;">
                    <div style="width: 100%; text-align: center; margin-bottom: 5px; font-size: 11px; font-weight: bold; color: #555;">MUDAR FORMATO DO CORTE:</div>
                    <button type="button" class="btn-ratio active" onclick="mudarProporcao(16/9, this)">16:9 (Padrão)</button>
                    <button type="button" class="btn-ratio" onclick="mudarProporcao(4/3, this)">4:3 (Notícia)</button>
                    <button type="button" class="btn-ratio" onclick="mudarProporcao(1, this)">1:1 (Quadrado)</button>
                    <button type="button" class="btn-ratio" onclick="mudarProporcao(9/16, this)">9:16 (Vertical)</button>
                    <button type="button" class="btn-confirm-crop" onclick="cortarImagem()"><i class="fas fa-check-circle"></i> Confirmar Corte Agora</button>
                </div>

                <label style="margin-top: 15px; font-size: 11px; color: #777;">COMO VAI FICAR NO SITE:</label>
                <div class="preview-box" id="previewContainer">
                    <span id="previewText" style="color: #999; font-size: 12px;">Nenhuma foto cortada</span>
                    <img id="previewImg" src="" style="display: none;">
                </div>
                <input type="hidden" id="imagemBase64">

                <div class="form-group" style="margin-top: 15px;">
                    <label>Créditos da Foto (Obrigatório)</label>
                    <input type="text" id="fonteImagem" placeholder="Ex: Divulgação / Reprodução Redes Sociais">
                </div>
            </div>

            <!-- CONTEÚDO DA NOTÍCIA -->
            <div class="section-box">
                <div class="section-title"><i class="fas fa-newspaper"></i> Redação da Matéria</div>

                <div class="form-group">
                    <label>Título da Matéria</label>
                    <input type="text" id="titulo" placeholder="Digite uma manchete chamativa..." required style="font-size: 18px; font-weight: bold;">
                </div>

                <div class="form-group">
                    <label>Autor / Repórter</label>
                    <input type="text" id="autor" placeholder="Seu nome ou CG NEWS">
                </div>

                <div class="form-group">
                    <label>Corpo do Texto (Editor Profissional)</label>
                    <!-- CONTAINER DO QUILL.JS -->
                    <div id="editor-container"></div>
                </div>

                <div class="form-group">
                    <label>Fonte da Informação</label>
                    <input type="text" id="fonteNoticia" placeholder="De onde veio a notícia?">
                </div>
            </div>

            <!-- VÍDEOS E ANÚNCIOS -->
            <div class="section-box">
                <div class="section-title"><i class="fas fa-link"></i> Extras (Vídeos e Publicidade)</div>
                
                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-bottom: 10px;">
                    <div class="form-group">
                        <label>Plataforma</label>
                        <select id="plataformaRede">
                            <option value="">Nenhuma</option>
                            <option value="instagram">Instagram</option>
                            <option value="tiktok">TikTok</option>
                            <option value="youtube">YouTube</option>
                            <option value="facebook">Facebook</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Link do Vídeo / Post</label>
                        <input type="text" id="linkRedeSocial" placeholder="Cole o link aqui...">
                    </div>
                </div>

                <div class="form-group">
                    <label>Link de Anúncio / Patrocinador</label>
                    <input type="text" id="anuncioCod" placeholder="Link de publicidade (Opcional)">
                </div>
            </div>

            <button type="submit" id="btnSalvar" class="btn-submit"><i class="fas fa-upload"></i> PUBLICAR MATÉRIA</button>
            <button type="button" id="btnCancelar" class="btn-cancelar" onclick="cancelarEdicao()"><i class="fas fa-times"></i> CANCELAR EDIÇÃO</button>
        </form>

        <h2 style="color: #11136c; font-size: 18px; margin: 30px 0 15px 0; font-weight: 900; text-transform: uppercase;"><i class="fas fa-database"></i> Central de Edição (Publicadas)</h2>
        <div id="lista-noticias">
            <p style="color: #666; font-size: 14px;">Conectando ao servidor...</p>
        </div>

    </div>

    <!-- SCRIPTS ESSENCIAIS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <!-- FIREBASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjl4R4h2An2POmuZgMhAFsLbdhuzauxyY",
            authDomain: "cgnewsoficial7799.firebaseapp.com",
            projectId: "cgnewsoficial7799",
            storageBucket: "cgnewsoficial7799.firebasestorage.app",
            messagingSenderId: "792965935073",
            appId: "1:792965935073:web:6a43726000feec3b356ca0",
            measurementId: "G-MCQJ63SYP1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // INICIALIZAÇÃO DO EDITOR DE TEXTO RICO (QUILL)
        const quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'Escreva a notícia com todos os detalhes aqui...',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'header': [1, 2, 3, false] }],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'blockquote'],
                    ['clean'] // remover formatação
                ]
            }
        });

        let idEditando = null;
        let cropper = null;
        window.noticiasAdmin = {}; // Armazena os dados globalmente

        // LOGICA DE CORTE DE IMAGEM 3.0
        document.getElementById('imagemInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const imgEl = document.getElementById('imageToCrop');
                imgEl.src = evt.target.result;
                
                document.getElementById('cropperWrapper').style.display = 'block';
                document.getElementById('ratioControls').style.display = 'flex';

                if (cropper) cropper.destroy();
                
                // Configuração ideal para Celular (DragMode Move)
                cropper = new Cropper(imgEl, {
                    aspectRatio: 16 / 9,
                    viewMode: 2, // Previne que a imagem fique perdida no preto
                    dragMode: 'move', // Facilita arrastar no celular
                    autoCropArea: 1,
                    responsive: true,
                    background: false
                });
            };
            reader.readAsDataURL(file);
        });

        window.mudarProporcao = function(ratio, btn) {
            if (cropper) cropper.setAspectRatio(ratio);
            
            // Muda a cor do botão ativo
            document.querySelectorAll('.btn-ratio').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };

        window.cortarImagem = function() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 1200, imageSmoothingEnabled: true, imageSmoothingQuality: 'high' });
            const base64 = canvas.toDataURL('image/jpeg', 0.85);

            document.getElementById('imagemBase64').value = base64;
            const previewImg = document.getElementById('previewImg');
            previewImg.src = base64;
            previewImg.style.display = 'block';
            document.getElementById('previewText').style.display = 'none';
            alert('Corte perfeito! Imagem pronta para a capa.');
        };

        // SALVAR OU EDITAR (FIREBASE)
        document.getElementById('formNoticia').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Pega o conteúdo HTML rico do Quill
            const textoRico = quill.root.innerHTML;
            if (textoRico === '<p><br></p>') {
                alert("Por favor, escreva o texto da matéria.");
                return;
            }

            document.getElementById('btnSalvar').innerHTML = "<i class='fas fa-spinner fa-spin'></i> SALVANDO...";

            const checkboxes = document.querySelectorAll('input[name="categoria"]:checked');
            const categoriasSelecionadas = Array.from(checkboxes).map(cb => cb.value);

            const noticiaDados = {
                categorias: categoriasSelecionadas,
                categoria: categoriasSelecionadas.length > 0 ? categoriasSelecionadas[0] : "Geral",
                imagem: document.getElementById('imagemBase64').value,
                fonteImagem: document.getElementById('fonteImagem').value,
                plataformaRede: document.getElementById('plataformaRede').value,
                linkRedeSocial: document.getElementById('linkRedeSocial').value,
                autor: document.getElementById('autor').value,
                titulo: document.getElementById('titulo').value,
                texto: textoRico, // Salva o texto com negrito, cores, etc.
                fonteNoticia: document.getElementById('fonteNoticia').value,
                anuncioCod: document.getElementById('anuncioCod').value,
                dataAtualizacao: Date.now()
            };

            try {
                if (idEditando) {
                    await updateDoc(doc(db, "noticias", idEditando), noticiaDados);
                    alert("✅ MATÉRIA ATUALIZADA COM SUCESSO!");
                } else {
                    noticiaDados.dataCriacao = Date.now();
                    await addDoc(collection(db, "noticias"), noticiaDados);
                    alert("🚀 MATÉRIA PUBLICADA NO SITE!");
                }
                cancelarEdicao();
                carregarListaNoticias();
            } catch (error) {
                console.error("Erro:", error);
                alert("Erro ao salvar! Verifique a internet.");
            } finally {
                document.getElementById('btnSalvar').innerHTML = "<i class='fas fa-upload'></i> PUBLICAR MATÉRIA";
            }
        });

        // CARREGAR LISTA
        window.carregarListaNoticias = async function() {
            const listaDiv = document.getElementById("lista-noticias");
            listaDiv.innerHTML = "<p>Buscando matérias no servidor...</p>";

            try {
                const q = query(collection(db, "noticias"), orderBy("dataAtualizacao", "desc"));
                const snapshot = await getDocs(q);
                listaDiv.innerHTML = "";

                if (snapshot.empty) {
                    listaDiv.innerHTML = "<p>Nenhuma matéria publicada ainda.</p>";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const id = docSnap.id;
                    window.noticiasAdmin[id] = item;

                    const dataFormatada = new Date(item.dataAtualizacao).toLocaleString('pt-BR');

                    listaDiv.innerHTML += `
                        <div class="noticia-item">
                            <div class="noticia-info">
                                <strong>${item.titulo}</strong>
                                <div>
                                    <span>${dataFormatada}</span>
                                    <span>${item.categorias ? item.categorias.join(', ') : 'Sem categoria'}</span>
                                </div>
                            </div>
                            <div class="acoes-btn">
                                <button type="button" class="btn-editar" onclick="prepararEdicao('${id}')"><i class="fas fa-edit"></i> Editar</button>
                                <button type="button" class="btn-apagar" onclick="apagarNoticia('${id}')"><i class="fas fa-trash"></i> Apagar</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Erro ao listar:", error);
                listaDiv.innerHTML = "<p>Erro ao carregar notícias.</p>";
            }
        };

        // EDITAR (PUXA OS DADOS PARA CIMA)
        window.prepararEdicao = function(id) {
            const item = window.noticiasAdmin[id];
            if (!item) return;

            idEditando = id;
            window.scrollTo({ top: 0, behavior: 'smooth' });

            document.getElementById("btnSalvar").innerHTML = "<i class='fas fa-sync'></i> ATUALIZAR MATÉRIA";
            document.getElementById("btnSalvar").style.backgroundColor = "#28a745";
            document.getElementById("btnCancelar").style.display = "block";

            // Preenche os campos
            document.getElementById("titulo").value = item.titulo || "";
            quill.root.innerHTML = item.texto || ""; // Preenche o editor rico
            document.getElementById("autor").value = item.autor || "";
            document.getElementById("plataformaRede").value = item.plataformaRede || "";
            document.getElementById("linkRedeSocial").value = item.linkRedeSocial || "";
            document.getElementById("fonteImagem").value = item.fonteImagem || "";
            document.getElementById("fonteNoticia").value = item.fonteNoticia || "";
            document.getElementById("anuncioCod").value = item.anuncioCod || "";
            document.getElementById("imagemBase64").value = item.imagem || "";

            // Carrega a imagem no preview
            if (item.imagem) {
                const previewImg = document.getElementById('previewImg');
                previewImg.src = item.imagem;
                previewImg.style.display = 'block';
                document.getElementById('previewText').style.display = 'none';
            } else {
                document.getElementById('previewImg').style.display = 'none';
                document.getElementById('previewText').style.display = 'block';
            }

            // Marca as categorias
            document.querySelectorAll('input[name="categoria"]').forEach(cb => cb.checked = false);
            if (item.categorias) {
                item.categorias.forEach(cat => {
                    const check = document.querySelector(`input[name="categoria"][value="${cat}"]`);
                    if (check) check.checked = true;
                });
            }
        };

        // APAGAR
        window.apagarNoticia = async function(id) {
            if (confirm("⚠️ TEM CERTEZA ABSOLUTA? Esta matéria será excluída para sempre do site!")) {
                try {
                    await deleteDoc(doc(db, "noticias", id));
                    alert("🗑️ Matéria apagada com sucesso!");
                    carregarListaNoticias();
                } catch (error) {
                    console.error("Erro ao apagar:", error);
                    alert("Erro ao apagar a matéria.");
                }
            }
        };

        // CANCELAR EDIÇÃO / LIMPAR TELA
        window.cancelarEdicao = function() {
            idEditando = null;
            document.getElementById("formNoticia").reset();
            quill.setContents([]); // Limpa o editor de texto
            
            document.getElementById("imagemBase64").value = "";
            document.getElementById("previewImg").style.display = "none";
            document.getElementById("previewText").style.display = "block";
            
            document.getElementById('cropperWrapper').style.display = "none";
            document.getElementById('ratioControls').style.display = "none";
            if (cropper) cropper.destroy();

            document.getElementById("btnSalvar").innerHTML = "<i class='fas fa-upload'></i> PUBLICAR MATÉRIA";
            document.getElementById("btnSalvar").style.backgroundColor = "#11136c";
            document.getElementById("btnCancelar").style.display = "none";
        };

        // Inicia carregando os posts
        carregarListaNoticias();
    </script>
</body>
</html>

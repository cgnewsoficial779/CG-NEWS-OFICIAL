<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Redação</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: #ffffff; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border-top: 6px solid #11136c; }
        .login-container h2 { color: #11136c; margin-bottom: 25px; font-weight: 800; font-size: 24px; text-transform: uppercase; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; color: #333; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #11136c; box-shadow: 0 0 5px rgba(17, 19, 108, 0.3); }
        .btn-login { width: 100%; background-color: #11136c; color: white; border: none; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-login:hover { background-color: #1a23a0; }
        .forgot-password { display: block; margin-top: 15px; font-size: 13px; color: #64748b; text-decoration: none; font-weight: 600; cursor: pointer; }
        .forgot-password:hover { color: #11136c; text-decoration: underline; }
        .alert-msg { margin-bottom: 15px; padding: 10px; border-radius: 5px; font-size: 13px; font-weight: 600; display: none; }
        .alert-error { background-color: #fee2e2; color: #991b1b; }
        .alert-success { background-color: #dcfce7; color: #166534; }
    </style>

    <!-- MOTOR DO FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // CHAVES OFICIAIS DO SEU FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDjL4R4h2An2POmuZgMhAFsLbdhuzauxys",
            authDomain: "cgnewsoficial7799.firebaseapp.com",
            projectId: "cgnewsoficial7799",
            storageBucket: "cgnewsoficial7799.firebasestorage.app",
            messagingSenderId: "792965935073",
            appId: "1:792965935073:web:6a43726000feec3b356cdf",
            measurementId: "G-MCQJ63SYP1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.fazerLogin = function(event) {
            event.preventDefault();
            const email = document.getElementById("user").value.trim();
            const pass = document.getElementById("pass").value;
            const msgBox = document.getElementById("msg-box");

            signInWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    msgBox.className = "alert-msg alert-success";
                    msgBox.innerText = "Acesso autorizado! Redirecionando...";
                    msgBox.style.display = "block";
                    setTimeout(() => {
                        window.location.href = "admin-painel.html";
                    }, 1200);
                })
                .catch((error) => {
                    msgBox.className = "alert-msg alert-error";
                    msgBox.innerText = "E-mail ou senha incorretos. Verifique e tente novamente.";
                    msgBox.style.display = "block";
                });
        };

        window.recuperarSenha = function() {
            const email = prompt("Digite o e-mail cadastrado para redefinir a senha:");
            if (email) {
                sendPasswordResetEmail(auth, email)
                    .then(() => {
                        alert("E-mail de redefinição enviado com sucesso! Verifique a sua caixa de entrada e o lixo eletrônico/spam.");
                    })
                    .catch((error) => {
                        alert("Erro ao enviar o e-mail: Verifique se o endereço digitado está correto e cadastrado.");
                    });
            }
        };
    </script>
</head>
<body>

    <div class="login-container">
        <h2>Área Administrativa</h2>
        <div id="msg-box" class="alert-msg"></div>
        <form onsubmit="fazerLogin(event)">
            <div class="input-group">
                <label>E-mail do Administrador</label>
                <input type="email" id="user" placeholder="seu-email@exemplo.com" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="pass" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn-login">Entrar no Painel</button>
            <a onclick="recuperarSenha()" class="forgot-password">Esqueceu a senha? Clique aqui.</a>
        </form>
    </div>

</body>
</html>

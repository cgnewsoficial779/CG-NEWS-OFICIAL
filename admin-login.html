<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Redação</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: #1a1a24; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; border-top: 6px solid #ff4757; }
        .login-container h2 { color: #ffffff; margin-bottom: 25px; font-weight: 800; font-size: 24px; text-transform: uppercase; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        .input-group input { width: 100%; padding: 12px; background-color: #2d2d3a; border: 1px solid #4b4b5c; color: white; border-radius: 6px; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #ff4757; box-shadow: 0 0 5px rgba(255, 71, 87, 0.3); }
        .btn-login { width: 100%; background-color: #11136c; color: white; border: none; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-login:hover { background-color: #0d0f52; }
        .alert-msg { margin-bottom: 15px; padding: 10px; border-radius: 5px; font-size: 13px; font-weight: 600; display: none; }
        .alert-error { background-color: #fee2e2; color: #991b1b; }
        .alert-success { background-color: #dcfce7; color: #166534; }
    </style>

    <script>
        window.fazerLogin = function(event) {
            event.preventDefault();
            const email = document.getElementById("user").value.trim();
            const pass = document.getElementById("pass").value;
            const msgBox = document.getElementById("msg-box");

            if (email === "cgnewsoficial@gmail.com" && pass === "@M4x98209980") {
                msgBox.className = "alert-msg alert-success";
                msgBox.innerText = "Acesso autorizado! Carregando painel...";
                msgBox.style.display = "block";
                
                sessionStorage.setItem("acesso_cgnews_liberado", "sim");
                
                setTimeout(() => {
                    window.location.href = "painel-secreto.html";
                }, 1000);
            } else {
                msgBox.className = "alert-msg alert-error";
                msgBox.innerText = "Acesso Negado. E-mail ou senha incorretos.";
                msgBox.style.display = "block";
            }
        };
    </script>
</head>
<body>
    <div class="login-container">
        <h2>Área Administrativa</h2>
        <div id="msg-box" class="alert-msg"></div>
        <form onsubmit="fazerLogin(event)">
            <div class="input-group">
                <label>E-mail do Administrador</label>
                <input type="email" id="user" placeholder="seu-email@exemplo.com" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="pass" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn-login">Entrar no Painel</button>
        </form>
    </div>
</body>
</html>

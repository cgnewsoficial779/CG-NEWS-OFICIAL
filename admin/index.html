<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CG NEWS OFICIAL — O seu portal de notícias</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f2f4f7; color: #1a1a1a; }
        
        header { background: #11136c; color: white; padding: 20px; text-align: center; border-bottom: 4px solid #1a23a0; }
        header h1 { font-size: 2rem; font-weight: 900; letter-spacing: 1px; }
        header p { font-size: 0.9rem; color: #cbd5e1; margin-top: 5px; }

        nav { background: #1a23a0; padding: 10px; text-align: center; overflow-x: auto; white-space: nowrap; }
        nav a { color: white; text-decoration: none; padding: 8px 15px; font-weight: 600; font-size: 0.95rem; display: inline-block; transition: opacity 0.2s; }
        nav a:hover { opacity: 0.8; text-decoration: underline; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }

        /* DESTAQUE PRINCIPAL */
        .super-destaque { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.08); margin-bottom: 25px; border-left: 5px solid #11136c; }
        .super-destaque img, .super-destaque video { width: 100%; max-height: 400px; object-fit: cover; display: block; }
        .super-destaque-content { padding: 20px; }
        .badge-cat { background: #11136c; color: white; padding: 4px 10px; font-size: 0.75rem; font-weight: bold; border-radius: 4px; text-transform: uppercase; display: inline-block; margin-bottom: 10px; }
        .super-destaque h2 { font-size: 1.8rem; color: #11136c; margin-bottom: 10px; line-height: 1.3; }
        .super-destaque p { font-size: 1.05kp; color: #475569; margin-bottom: 15px; }

        /* GRID DE NOTÍCIAS */
        .news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .news-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .news-card:hover { transform: translateY(-3px); }
        .news-card img, .news-card video { width: 100%; height: 180px; object-fit: cover; }
        .news-card-body { padding: 15px; flex-grow: 1; }
        .news-card h3 { font-size: 1.2rem; color: #1e293b; margin-bottom: 8px; line-height: 1.3; }
        .news-card p { font-size: 0.9rem; color: #64748b; margin-bottom: 12px; }
        
        .news-meta { font-size: 0.8rem; color: #94a3b8; padding: 12px 15px; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }

        /* BOTÕES DE REDES SOCIAIS NA MATÉRIA */
        .social-share-box { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; padding-top: 12px; border-top: 1px dashed #e2e8f0; }
        .social-btn { padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: white; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-insta { background: #e1306c; }
        .btn-face { background: #1877f2; }
        .btn-x { background: #000000; }
        .btn-threads { background: #101010; }
        .btn-tiktok { background: #25f4ee; color: #000; }
        .btn-kwai { background: #ff7700; }
        .btn-linkedin { background: #0a66c2; }

        .sem-noticias { text-align: center; padding: 50px; background: white; border-radius: 8px; color: #64748b; font-size: 1.1rem; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }

        footer { background: #1e293b; color: white; text-align: center; padding: 25px; margin-top: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>CG NEWS OFICIAL</h1>
        <p>O seu portal confiável de notícias de Campo Grande, MS e do Brasil</p>
    </header>

    <nav>
        <a href="#" onclick="filtrarCategoria('Todas')">Início</a>
        <a href="#" onclick="filtrarCategoria('Últimas Notícias')">Últimas Notícias</a>
        <a href="#" onclick="filtrarCategoria('Polícia')">Polícia</a>
        <a href="#" onclick="filtrarCategoria('Trânsito')">Trânsito</a>
        <a href="#" onclick="filtrarCategoria('Campo Grande')">Campo Grande</a>
        <a href="#" onclick="filtrarCategoria('Mato Grosso do Sul')">Mato Grosso do Sul</a>
        <a href="#" onclick="filtrarCategoria('Brasil')">Brasil</a>
        <a href="#" onclick="filtrarCategoria('Mundo')">Mundo</a>
    </nav>

    <div class="container" id="portal-conteudo">
        </div>

    <footer>
        © 2026 CG NEWS OFICIAL — Todos os direitos reservados.
    </footer>

    <script>
        let categoriaAtual = 'Todas';

        window.addEventListener('DOMContentLoaded', () => {
            carregarNoticias();
        });

        function filtrarCategoria(cat) {
            categoriaAtual = cat;
            carregarNoticias();
        }

        function carregarNoticias() {
            const container = document.getElementById('portal-conteudo');
            const noticias = JSON.parse(localStorage.getItem('portal_noticias')) || [];

            if (noticias.length === 0) {
                container.innerHTML = `<div class="sem-noticias">Nenhuma notícia publicada no momento. Acesse o painel administrativo para incluir matérias!</div>`;
                return;
            }

            let noticiasFiltradas = noticias;
            if (categoriaAtual !== 'Todas') {
                noticiasFiltradas = noticias.filter(n => n.categoria === categoriaAtual);
            }

            if (noticiasFiltradas.length === 0) {
                container.innerHTML = `<div class="sem-noticias">Nenhuma notícia encontrada nesta editoria no momento.</div>`;
                return;
            }

            let htmlGeral = '';

            // Renderiza Super Destaque se estiver na página inicial
            if (categoriaAtual === 'Todas') {
                const superIndex = noticiasFiltradas.findIndex(n => n.superDestaque);
                if (superIndex !== -1) {
                    const sup = noticiasFiltradas[superIndex];
                    // Remove do loop comum para não duplicar
                    noticiasFiltradas.splice(superIndex, 1);

                    let midiaSup = '';
                    if (sup.imagem) {
                        if (sup.imagem.startsWith('data:video')) {
                            midiaSup = `<video src="${sup.imagem}" controls></video>`;
                        } else {
                            midiaSup = `<img src="${sup.imagem}" alt="${sup.titulo}">`;
                        }
                    }

                    htmlGeral += `
                        <div class="super-destaque">
                            ${midiaSup}
                            <div class="super-destaque-content">
                                <span class="badge-cat">${sup.categoria || 'Geral'}</span>
                                <h2>${sup.titulo}</h2>
                                <p><strong>${sup.subtitulo || ''}</strong></p>
                                <p style="white-space: pre-line; color: #334155;">${sup.corpo || ''}</p>
                                ${gerarBotoesSociais(sup.redesSociais)}
                                <div class="news-meta" style="margin-top: 15px; border-top: 1px solid #f1f5f9; padding-top: 10px;">
                                    <span>Por: ${sup.autor || 'Redação'} | ${sup.data || ''}</span>
                                    <span>${sup.fonteImagem ? 'Foto: ' + sup.fonteImagem : ''}</span>
                                </div>
                            </div>
                        </div>
                        <div class="news-grid" id="gridNoticiasComuns"></div>
                    `;
                } else {
                    htmlGeral += `<div class="news-grid" id="gridNoticiasComuns"></div>`;
                }
            } else {
                htmlGeral += `<div class="news-grid" id="gridNoticiasComuns"></div>`;
            }

            container.innerHTML = htmlGeral;

            const gridComum = document.getElementById('gridNoticiasComuns');
            let htmlCards = '';

            noticiasFiltradas.forEach(noticia => {
                let midiaCard = '';
                if (noticia.imagem) {
                    if (noticia.imagem.startsWith('data:video')) {
                        midiaCard = `<video src="${noticia.imagem}" controls></video>`;
                    } else {
                        midiaCard = `<img src="${noticia.imagem}" alt="${noticia.titulo}">`;
                    }
                }

                htmlCards += `
                    <div class="news-card">
                        <div>
                            ${midiaCard}
                            <div class="news-card-body">
                                <span class="badge-cat" style="font-size: 0.7rem; margin-bottom: 6px;">${noticia.categoria || 'Geral'}</span>
                                <h3>${noticia.titulo}</h3>
                                <p>${noticia.subtitulo || noticia.corpo.substring(0, 90) + '...'}</p>
                                ${gerarBotoesSociais(noticia.redesSociais)}
                            </div>
                        </div>
                        <div class="news-meta">
                            <span>Por: ${noticia.autor || 'Redação'}</span>
                            <span>${noticia.data || ''}</span>
                        </div>
                    </div>
                `;
            });

            if (gridComum) {
                gridComum.innerHTML = htmlCards;
            }
        }

        function gerarBotoesSociais(redes) {
            if (!redes) return '';
            let botoes = '';

            if (redes.instagram) botoes += `<a href="${redes.instagram}" target="_blank" class="social-btn btn-insta"><i class="fa-brands fa-instagram"></i> Instagram</a>`;
            if (redes.facebook) botoes += `<a href="${redes.facebook}" target="_blank" class="social-btn btn-face"><i class="fa-brands fa-facebook-f"></i> Facebook</a>`;
            if (redes.x) botoes += `<a href="${redes.x}" target="_blank" class="social-btn btn-x"><i class="fa-brands fa-x-twitter"></i> X</a>`;
            if (redes.threads) botoes += `<a href="${redes.threads}" target="_blank" class="social-btn btn-threads"><i class="fa-brands fa-threads"></i> Threads</a>`;
            if (redes.tiktok) botoes += `<a href="${redes.tiktok}" target="_blank" class="social-btn btn-tiktok"><i class="fa-brands fa-tiktok"></i> TikTok</a>`;
            if (redes.kwai) botoes += `<a href="${redes.kwai}" target="_blank" class="social-btn btn-kwai"><i class="fa-solid fa-video"></i> Kwai</a>`;
            if (redes.linkedin) botoes += `<a href="${redes.linkedin}" target="_blank" class="social-btn btn-linkedin"><i class="fa-brands fa-linkedin-in"></i> LinkedIn</a>`;

            if (botoes === '') return '';
            return `<div class="social-share-box">${botoes}</div>`;
        }
    </script>
</body>
</html>

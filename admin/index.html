<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CG NEWS OFICIAL - Painel Administrativo</title>
  
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <style>
    :root {
      --cg-primary: #11136c;
      --cg-hover: #1a23a0;
    }
    body {
      background-color: #f2f4f7 !important;
      margin: 0;
    }
    #cg-custom-header {
      background-color: var(--cg-primary);
      color: #ffffff;
      padding: 18px 20px;
      font-size: 19px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 1px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    #cg-custom-footer {
      background-color: var(--cg-primary);
      color: #ffffff;
      text-align: center;
      padding: 15px;
      font-size: 13px;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 999;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.2);
    }
    #nc-root {
      min-height: calc(100vh - 110px);
      padding-bottom: 60px;
    }
  </style>
</head>
<body>

  <div id="cg-custom-header">
    CG NEWS OFICIAL - PAINEL ADMINISTRATIVO
  </div>

  <div id="nc-root"></div>

  <div id="cg-custom-footer">
    CG NEWS OFICIAL - Todos os direitos reservados &copy; 2026 | Painel Administrativo
  </div>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.reload();
          });
        }
      });
    }
  </script>
</body>
</html>

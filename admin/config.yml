backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "noticias"
    label: "Notícias"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Subtítulo", name: "subtitle", widget: "string", required: false}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Autor", name: "autor", widget: "string", default: "CG News Oficial"}
      - {label: "Categoria", name: "categoria", widget: "select", options: ["Últimas Notícias", "Polícia", "Trânsito", "Campo Grande", "Mato Grosso do Sul", "Brasil", "Mundo"]}
      - {label: "Imagem de Capa", name: "image", widget: "image"}
      - {label: "Conteúdo da Notícia", name: "body", widget: "markdown"}
